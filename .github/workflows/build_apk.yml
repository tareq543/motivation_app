name: Build CondBlocker APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake gettext ccache

      - name: Install Buildozer, Cython, and setuptools (with distutils)
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv "setuptools==69.5.1" packaging

      # ---- Fails in ~2s instead of after a 40min build (this is what broke run #6) ----
      - name: Syntax check Python sources
        run: |
          python -m py_compile main.py database.py usage_tracker.py \
            android_services.py service.py p4a_hook.py
          echo "syntax check passed"

      # ---- Cache 1: only the SDK/NDK + downloads (safe to share between builds) ----
      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: toolchain-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            toolchain-v1-${{ runner.os }}-

      # ---- Cache 2: the p4a dist. EXACT key only, no restore-keys, so a stale
      #      dist compiled from different requirements can never be reused. ----
      - name: Restore dist cache
        uses: actions/cache/restore@v4
        with:
          path: .buildozer
          key: dist-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Ensure Android SDK tools and build-tools 34.0.0 are installed
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          BT_DIR="$SDK_DIR/build-tools"
          if [ ! -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            CMDLINE=$(find /usr/local/lib/android/sdk/cmdline-tools -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n 1 || true)
            if [ -n "$CMDLINE" ] && [ -f "$CMDLINE/bin/sdkmanager" ]; then
              mkdir -p "$SDK_DIR/tools" "$SDK_DIR/cmdline-tools"
              cp -rn "$CMDLINE"/* "$SDK_DIR/tools/"
              cp -rn "$CMDLINE" "$SDK_DIR/cmdline-tools/latest" 2>/dev/null || true
            else
              rm -rf "$SDK_DIR"
            fi
          fi
          if [ -d "$SDK_DIR" ]; then
            mkdir -p "$BT_DIR"
            rm -rf "$BT_DIR"/*-rc* "$BT_DIR"/35* "$BT_DIR"/36* "$BT_DIR"/37* || true
            if [ -d "/usr/local/lib/android/sdk/build-tools" ]; then
              cp -rn /usr/local/lib/android/sdk/build-tools/34* "$BT_DIR"/ 2>/dev/null || true
            fi
            SDKMGR="$SDK_DIR/tools/bin/sdkmanager"
            if [ -f "$SDKMGR" ]; then
              yes | "$SDKMGR" --sdk_root="$SDK_DIR" --licenses || true
              yes | "$SDKMGR" --sdk_root="$SDK_DIR" "build-tools;34.0.0" "platforms;android-34" "platform-tools" || true
            fi
            echo "Installed build-tools:"
            ls -la "$BT_DIR"
          fi

      # ---- No gradle fallback: that path skipped p4a_hook.py and shipped an APK
      #      built from a wiped assets/ dir, which installs then dies instantly. ----
      - name: Build Debug APK
        id: build
        run: |
          set -o pipefail
          buildozer -v android debug < <(yes 2>/dev/null) 2>&1 | tee buildozer.log

      # ---- Fail here instead of shipping an APK that installs then dies ----
      # p4a layout (v2024.01.21): app files live in assets/private.tar, while the
      # Python packages live in lib/<abi>/libpybundle.so (a gzipped tar despite
      # the .so extension). Never pipe a big listing into `grep -q` either:
      # grep exits on first match, tar dies with SIGPIPE (141) and `pipefail`
      # turns that into a false "missing" error.
      - name: Sanity check APK contents
        id: sanity
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import re
          import tarfile
          import zipfile
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(f"::error::{message}")
              print(f"ok: {message}", flush=True)

          def tar_entries(apk, member):
              with apk.open(member) as stream:
                  with tarfile.open(fileobj=stream, mode="r|*") as archive:
                      return {item.name for item in archive if item.isfile()}

          apks = sorted(Path("bin").glob("*.apk"))
          require(bool(apks), "APK exists")

          for path in apks:
              print(f"Checking {path}", flush=True)
              with zipfile.ZipFile(path) as apk:
                  names = set(apk.namelist())

                  require("assets/private.tar" in names, "app archive exists")
                  app = tar_entries(apk, "assets/private.tar")

                  require(
                      any(re.search(r"(^|/)main\.pyc?$", n) for n in app),
                      "main.py/main.pyc in private.tar",
                  )
                  require(
                      any(n.endswith("assets/fonts/arabic.ttf") for n in app),
                      "Arabic font in private.tar",
                  )

                  for abi in ("arm64-v8a", "armeabi-v7a"):
                      prefix = f"lib/{abi}/"

                      require(
                          any(
                              n.startswith(prefix + "libpython3")
                              and n.endswith(".so")
                              for n in names
                          ),
                          f"{abi}: libpython",
                      )
                      require(
                          prefix + "libSDL2.so" in names,
                          f"{abi}: libSDL2",
                      )

                      bundle = prefix + "libpybundle.so"
                      require(bundle in names, f"{abi}: Python bundle exists")
                      packages = tar_entries(apk, bundle)

                      print(
                          f"{abi}: {len(packages)} files in Python bundle",
                          flush=True,
                      )

                      for package in ("kivy", "kivymd", "jnius"):
                          pattern = rf"(^|/){package}/__init__\.pyc?$"
                          require(
                              any(re.search(pattern, n) for n in packages),
                              f"{abi}: {package} in Python bundle",
                          )

                      require(
                          any(
                              re.search(
                                  r"(^|/)(jnius/[^/]*\.so|jnius[^/]*\.so)$",
                                  n,
                              )
                              for n in packages
                          ),
                          f"{abi}: pyjnius native extension",
                      )
          PYTHON

          shopt -s nullglob
          AAPT2=("$HOME"/.buildozer/android/platform/android-sdk/build-tools/*/aapt2)

          if [ "${#AAPT2[@]}" -eq 0 ]; then
            echo "::error::aapt2 not found"
            exit 1
          fi

          for APK in bin/*.apk; do
            "${AAPT2[0]}" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/condblocker-manifest.txt

            for ITEM in AppBlockerAccessibilityService foregroundServiceType BootReceiver; do
              grep -qF "$ITEM" /tmp/condblocker-manifest.txt || {
                echo "::error::$ITEM missing from AndroidManifest.xml"
                exit 1
              }
              echo "ok: manifest $ITEM"
            done
          done

      - name: Save toolchain cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: toolchain-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Save dist cache
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: .buildozer
          key: dist-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            buildozer.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: condblocker-debug-apk
          path: bin/*.apk
          if-no-files-found: error
