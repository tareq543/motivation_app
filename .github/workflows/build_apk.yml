name: Build CondBlocker APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake gettext ccache

      - name: Install Buildozer, Cython, and Virtualenv
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv setuptools packaging

      - name: Restore Buildozer Cache
        uses: actions/cache/restore@v4
        id: restore-cache
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-
            buildozer-${{ runner.os }}-

      - name: Build Debug APK
        run: |
          set -o pipefail
          yes | buildozer android debug 2>&1 | tee buildozer_output.log

      - name: Show Error Tail on Failure
        if: failure()
        run: |
          echo "=== LINES RIGHT BEFORE COMMAND FAILED ==="
          grep -B 60 -A 5 "Command failed" buildozer_output.log || tail -n 150 buildozer_output.log

      - name: Save Buildozer Cache (Even on Failure)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: condblocker-debug-apk
          path: bin/*.apk
          if-no-files-found: error
