name: Build CondBlocker APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies for Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake gettext ccache

      - name: Install Buildozer, Cython, and setuptools (with distutils)
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv "setuptools==69.5.1" packaging

      - name: Syntax check Python sources
        run: |
          python -m py_compile main.py database.py usage_tracker.py \
            android_services.py service.py p4a_hook.py

      
      # ---- Cache 1: only the SDK/NDK + downloads (safe to share between builds) ----
      - name: Restore toolchain cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: toolchain-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            toolchain-v1-${{ runner.os }}-

      # ---- Cache 2: the p4a dist. EXACT key only, no restore-keys, so a stale
      #      dist compiled from different requirements can never be reused. ----
      - name: Restore dist cache
        uses: actions/cache/restore@v4
        with:
          path: .buildozer
          key: dist-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Ensure Android SDK tools and build-tools 34.0.0 are installed
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          BT_DIR="$SDK_DIR/build-tools"
          if [ ! -f "$SDK_DIR/tools/bin/sdkmanager" ]; then
            CMDLINE=$(find /usr/local/lib/android/sdk/cmdline-tools -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -n 1 || true)
            if [ -n "$CMDLINE" ] && [ -f "$CMDLINE/bin/sdkmanager" ]; then
              mkdir -p "$SDK_DIR/tools" "$SDK_DIR/cmdline-tools"
              cp -rn "$CMDLINE"/* "$SDK_DIR/tools/"
              cp -rn "$CMDLINE" "$SDK_DIR/cmdline-tools/latest" 2>/dev/null || true
            else
              rm -rf "$SDK_DIR"
            fi
          fi
          if [ -d "$SDK_DIR" ]; then
            mkdir -p "$BT_DIR"
            rm -rf "$BT_DIR"/*-rc* "$BT_DIR"/35* "$BT_DIR"/36* "$BT_DIR"/37* || true
            if [ -d "/usr/local/lib/android/sdk/build-tools" ]; then
              cp -rn /usr/local/lib/android/sdk/build-tools/34* "$BT_DIR"/ 2>/dev/null || true
            fi
            SDKMGR="$SDK_DIR/tools/bin/sdkmanager"
            if [ -f "$SDKMGR" ]; then
              yes | "$SDKMGR" --sdk_root="$SDK_DIR" --licenses || true
              yes | "$SDKMGR" --sdk_root="$SDK_DIR" "build-tools;34.0.0" "platforms;android-34" "platform-tools" || true
            fi
            echo "Installed build-tools:"
            ls -la "$BT_DIR"
          fi

      # ---- No gradle fallback: that path skipped p4a_hook.py and shipped a
      #      manifest without the accessibility service / FGS type. ----
      - name: Build Debug APK
        run: |
          set -o pipefail
          buildozer -v android debug < <(yes 2>/dev/null) 2>&1 | tee buildozer.log

      # ---- Fail here instead of shipping an APK that installs then dies ----
      - name: Sanity check APK contents
        run: |
          set -euo pipefail
          APK=$(ls -1 bin/*.apk | head -n 1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

          unzip -l "$APK" | grep -q "lib/arm64-v8a/libpython3" \
            || { echo "::error::libpython missing from APK"; exit 1; }
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libSDL2" \
            || { echo "::error::libSDL2 missing from APK"; exit 1; }

          unzip -p "$APK" assets/private.tar > /tmp/private.tar
          tar -tf /tmp/private.tar | grep -q "site-packages/kivymd/__init__.py" \
            || { echo "::error::kivymd missing from private.tar"; exit 1; }
          tar -tf /tmp/private.tar | grep -qE "(^|/)main\.pyc?$" \
            || { echo "::error::entrypoint main.py missing from private.tar"; exit 1; }
          tar -tf /tmp/private.tar | grep -q "site-packages/jnius" \
            || { echo "::error::pyjnius missing from private.tar"; exit 1; }
          tar -tf /tmp/private.tar | grep -q "assets/fonts/arabic.ttf" \
            || { echo "::error::bundled Arabic font missing"; exit 1; }

          AAPT2=$(ls "$HOME"/.buildozer/android/platform/android-sdk/build-tools/*/aapt2 2>/dev/null | head -n 1 || true)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > /tmp/manifest.txt
            grep -q "AppBlockerAccessibilityService" /tmp/manifest.txt \
              || { echo "::error::p4a_hook did not inject the accessibility service"; exit 1; }
            grep -q "foregroundServiceType" /tmp/manifest.txt \
              || { echo "::error::foregroundServiceType missing - Android 14 will kill the service"; exit 1; }
            grep -q "BootReceiver" /tmp/manifest.txt \
              || { echo "::error::BootReceiver missing from manifest"; exit 1; }
            echo "manifest checks passed"
          else
            echo "::warning::aapt2 not found, skipped manifest checks"
          fi

      - name: Save toolchain cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: toolchain-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Save dist cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .buildozer
          key: dist-v1-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: |
            buildozer.log
          if-no-files-found: warn

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: condblocker-debug-apk
          path: bin/*.apk
          if-no-files-found: error
